subject: Should nodejs/node#63869 (`--experimental-strip-private-modules`) land?

# Please set a score to each proposal according to your preferences.
# You should set the highest score to your favorite option.
# Negative scores are allowed, only the order matters.
# You can tie two or more proposals if you have no preference.
# To abstain, keep all the propositions tied.

preferences:
  - title: >-
      Land nodejs/node#63869: add `--experimental-strip-private-modules`, which
      allows type stripping under `node_modules` only when every enclosing
      package has `"private": true`. Extending it to non-private packages stays
      a documented non-goal.
    score: 0
  - title: >-
      Do not land nodejs/node#63869: Type stripping files in `node_modules`
      remains supported only through loaders.
    score: 0
